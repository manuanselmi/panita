[package]
name = "coucou-hook"
description = "Relays Claude Code hook events to Coucou over a named pipe"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "coucou-hook"
path = "src/main.rs"

[dependencies]
serde_json = "1"

# Just enough Win32 to know our own SID, to check who is serving the pipe, and
# to walk up our own ancestor processes (procs.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Kernel",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

# procs.rs checks its walk against a Toolhelp snapshot in its tests.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.61", features = ["Win32_System_Diagnostics_ToolHelp"] }
